trigger:
  branches:
    include:
      - azure-devops-pipeline
      - main

pr: none

variables:
  acrServiceConnection: 'acr-sujanreddy-conn'

stages:
  - stage: BuildAndPushImages
    displayName: Build and Push Docker Images
    jobs:
      - job: BuildAndPush_api_gateway
        displayName: Build and push api-gateway
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: azure-pipelines-image-job.yml
            parameters:
              serviceName: 'api-gateway'
              repositoryName: 'rebook-api-gateway'
              dockerfilePath: 'api-gateway/Dockerfile'
              buildContext: 'api-gateway'

      - job: BuildAndPush_auth_service
        displayName: Build and push auth-service
        dependsOn: []
        pool:
          vmImage: ubuntu-latest
