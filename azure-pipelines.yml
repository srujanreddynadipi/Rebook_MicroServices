trigger:
  branches:
    include:
      - azure-devops-pipeline
      - main

pr: none

variables:
  acrServiceConnection: 'acr-sujanreddy-conn'
  acrLoginServer: 'sujanreddy.azurecr.io'

stages:
  - stage: BuildAndPushImages
    displayName: Build and Push Docker Images
    jobs:
      - job: BuildAndPushAllImages
        displayName: Build and push all service images in parallel
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrServiceConnection)

          - bash: |
              set -euo pipefail

              services=(
                "api-gateway|rebook-api-gateway|api-gateway/Dockerfile|api-gateway"
                "auth-service|rebook-auth-service|auth-service/Dockerfile|auth-service"
                "book-service|rebook-book-service|book-service/Dockerfile|book-service"
                "request-service|rebook-request-service|request-service/Dockerfile|request-service"
                "chat-service|rebook-chat-service|chat-service/Dockerfile|chat-service"
                "notification-service|rebook-notification-service|notification-service/Dockerfile|notification-service"
                "rag-service|rebook-rag-service|rag-service/Dockerfile|rag-service"
                "eureka-server|rebook-eureka-server|eureka-server/Dockerfile|eureka-server"
                "frontend|rebook-frontend|frontend/Dockerfile|frontend"
              )

              build_and_push() {
                local service_name="$1"
                local repository_name="$2"
                local dockerfile_path="$3"
                local build_context="$4"

                echo "Starting $service_name"
                docker buildx build \
                  --push \
                  --tag "$(acrLoginServer)/${repository_name}:latest" \
                  --tag "$(acrLoginServer)/${repository_name}:$(Build.BuildId)" \
                  --tag "$(acrLoginServer)/${repository_name}:$(Build.SourceVersion)" \
                  -f "$dockerfile_path" \
                  "$build_context"
                echo "Finished $service_name"
              }

              for service in "${services[@]}"; do
                IFS='|' read -r service_name repository_name dockerfile_path build_context <<< "$service"
                build_and_push "$service_name" "$repository_name" "$dockerfile_path" "$build_context" &
              done

              wait
              echo "All image builds and pushes completed."
            displayName: Build and push all images in parallel